# Release pipeline: pushing a tag like `v0.1.1` builds release binaries on
# Windows / Linux / macOS and publishes them as a GitHub Release.
#
# Single source of truth for the version remains Cargo.toml. The `guard` job
# reads it via `cargo metadata` and fails the run if the tag does not match
# (e.g. tag v0.1.1 but Cargo.toml says 0.1.2), so releases can never drift.
#
# Usage:
#   cargo set-version 0.1.1        # or edit Cargo.toml
#   git commit -am "chore: release v0.1.1"
#   先 push 分支并等 CI 绿，再打 tag（见 docs/release-runbook.md 第 2 步：
#   check.yml 只在 push 到 master 时触发，推 tag 不跑它，所以别用 --tags 一锅推）：
#   git push origin master   # → 等 check 绿
#   git tag v0.9.0           # 单独两行：Windows PowerShell 5.1 不认 &&
#   git push origin v0.9.0
#
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create GitHub Release + upload artifacts

jobs:
  guard:
    name: Guard version/tag consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Read package version from Cargo.toml
        id: version
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "weflow-server") | .version')"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "cargo version: ${VERSION}"
          echo "tag: ${{ github.ref_name }}"

      - name: Verify tag matches version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "::error::Tag '${TAG}' does not match Cargo.toml version '${VERSION}'."
            echo "::error::Run 'cargo set-version' (or edit Cargo.toml), commit, then tag."
            exit 1
          fi
          echo "OK: tag ${TAG} matches Cargo.toml version ${VERSION}"

  # 质量门：release 前在同 tag 上重跑 clippy ＋ 全量测试 ＋ 契约 nails，
  # 防止「测试红着打 tag」——发布二进制里带进去的代码必须与主干同一质量线。
  quality-gate:
    name: Quality gate (clippy + test + conformance)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 与 build 作业同两个 OS：发布二进制跑在 Windows 上，质量门也必须在
        # Windows 上跑过 —— 平台特定的 cfg/依赖（如 OpenSSL 的 Windows 形态）
        # 只在 Windows 编译时暴露，ubuntu 一条线守不住它们。
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show

      - name: clippy (deny warnings)
        if: runner.os == 'Windows'
        run: powershell -File scripts/build.ps1 clippy --all-targets --locked -- -D warnings

      - name: clippy (deny warnings)
        if: runner.os != 'Windows'
        run: bash scripts/build.sh clippy --all-targets --locked -- -D warnings

      - name: Test
        if: runner.os == 'Windows'
        run: powershell -File scripts/build.ps1 test --locked

      - name: Test
        if: runner.os != 'Windows'
        run: bash scripts/build.sh test --locked

      # 与上面 clippy／test 两步同一成对模式：**Windows 必须走 build.ps1**。
      # 这一步刚加进 release 链时只有单一 bash 形态，第一次 tag 运行就在 windows 上红了：
      # Git Bash 自带的 MSYS perl 缺 Locale::Maketext::Simple，vendored OpenSSL 的 Configure
      # 直接失败（本机复现同一报错，退出码 101；而 powershell -File scripts/build.ps1 同一条
      # 命令在 Windows 上通过）——build.sh 不负责 MSVC／Strawberry Perl 环境，这是本仓的硬前置。
      - name: Conformance nails (contract data invariants)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pin="$(tr -d '[:space:]' < conformance.pin)"
          git clone --depth 1 --branch "$pin" https://github.com/ren-yc/flow-contract.git conformance-nails
          # bash 里 $PWD 是 /d/a/... 形态，PowerShell 不认；用 pwd -W 取 Windows 形态路径。
          dir="$(pwd -W)/conformance-nails"
          FLOW_CONTRACT_DIR="$dir" FLOW_CONTRACT_CASE="nails" \
            powershell -File scripts/build.ps1 test --locked --test conformance_runner -- --ignored

      - name: Conformance nails (contract data invariants)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pin="$(tr -d '[:space:]' < conformance.pin)"
          git clone --depth 1 --branch "$pin" https://github.com/ren-yc/flow-contract.git conformance-nails
          FLOW_CONTRACT_DIR="$PWD/conformance-nails" FLOW_CONTRACT_CASE="nails" \
            bash scripts/build.sh test --locked --test conformance_runner -- --ignored

  build:
    name: Build ${{ matrix.target }}
    needs: [guard, quality-gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90 # bundled SQLCipher/OpenSSL compile is slow
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show

      # Windows: reuse scripts/build.ps1 — it locates vcvars64.bat and puts
      # Strawberry Perl / nasm on PATH (GitHub's windows runners ship them).
      - name: Build release (Windows)
        if: runner.os == 'Windows'
        run: powershell -File scripts/build.ps1 build --release --locked

      - name: Build release (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/build.sh build --release --locked

      - name: Smoke test --version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.guard.outputs.version }}"
          BIN="target/release/weflow-server"
          [ "${{ runner.os }}" = "Windows" ] && BIN="${BIN}.exe"
          OUT="$("${BIN}" --version)"
          echo "${OUT}"
          case "${OUT}" in
            "weflow-server ${VERSION}"*) ;;
            *)
              echo "::error::unexpected --version output: ${OUT}"
              exit 1
              ;;
          esac

      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.guard.outputs.version }}"
          BIN="target/release/weflow-server"
          [ "${{ runner.os }}" = "Windows" ] && BIN="${BIN}.exe"
          PKG="weflow-server-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${PKG}"
          cp "${BIN}" "dist/${PKG}/"
          cp README.md LICENSE "dist/${PKG}/"
          echo "PKG=${PKG}" >> "${GITHUB_ENV}"
          ls -l "dist/${PKG}"

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "dist/${env:PKG}.zip"
          Compress-Archive -Path "dist/${env:PKG}" -DestinationPath $archive
          Write-Host $archive

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: tar -czf "dist/${PKG}.${{ matrix.archive }}" -C dist "${PKG}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: weflow-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        # artifacts/ also contains the unpacked staging directories
        # (weflow-server-<v>-<target>/), so hash only the archives.
        run: |
          shopt -s nullglob
          sha256sum *.zip *.tar.gz > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
  # crates.io / PyPI 发布通道。两条路径都用 OIDC 短期凭据：
  # - crates.io＝Trusted Publishing：本 repo 的两个 crate 已在 Settings 里登记本仓库、
  #   release.yml 与 `crates-io` environment；job 在这里停下等人工审批，
  #   再用 rust-lang/crates-io-auth-action 换取 30 分钟 token。
  # - PyPI＝pypa 的官方 action＋`pypi` environment 审批。
  # 两个 job 分开：crates 审批不牵连 PyPI，PyPI 也不会因为 crates 的 token
  # 没配好而拿到多余权限。crate 的首次发布仍需本机 `cargo publish`（crates.io
  # 无法为尚不存在的 crate 预登记 trusted publisher）；首次发布后登记
  # trusted publisher，后续版本全部由 CI 发布。
  crates:
    name: Publish to crates.io
    needs: [guard, build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 根包 verify 要编译 vendored OpenSSL
    # 人工闸门：发布不可撤销。crates-io environment 配 Required reviewers 后，
    # 作业会停在这里；crates.io 的 trusted publisher 必须登记同名 environment。
    environment: crates-io
    permissions:
      contents: read
      id-token: write # 只用于 OIDC 换取 crates.io 短期 token
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show

      # 一次 exchange 供同 repo 的两个 crate 共用；token 30 分钟过期，
      # action 的 post step 在 job 结束时撤销。
      - name: Authenticate with crates.io via OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # 顺序＝先 SDK、后根包：根包的依赖声明带 version，必须等 registry 上
      # 存在该版本才发布得出去。
      - name: Publish Rust SDK to crates.io
        working-directory: clients/rust
        env:
          CRATE: weflow-client
          VERS: ${{ needs.guard.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # crates.io 对不合规的 User-Agent 一律 403（实测：默认 curl UA 与被显式清空的
          # UA 都吃 403，必须带一个自定义值）。漏掉它会把「已上架」误判成「没上架」，
          # 守卫随即失效、撞 already-uploaded——正是这道守卫要防的半程卡死。
          if curl -sf -A "flow-release-guard" "https://crates.io/api/v1/crates/${CRATE}/${VERS}" >/dev/null; then
            echo "::notice::${CRATE} ${VERS} 已发布过，跳过（幂等重跑）"
          elif [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::OIDC 未换到 crates.io token；检查 crates-io environment 与 trusted publisher 配置"
            exit 1
          else
            cargo publish --locked
          fi

      # 上传成功 ≠ 可解析：稀疏索引经 CDN 传播有窗口，根包 verify 要解析 SDK；轮询到
      # 条目可见为止（上限 5 分钟），而不是靠一个没有依据的固定 sleep。
      # 判据取 grep 的退出码，因此**刻意不开 pipefail**：grep 命中即退出会让 curl 收到
      # SIGPIPE，加了 pipefail 就变成「永远轮询到超时」。改动这一步时留意这一点。
      - name: Wait for the sparse index to expose the SDK
        env:
          CRATE: weflow-client
          VERS: ${{ needs.guard.outputs.version }}
        run: |
          path="https://index.crates.io/${CRATE:0:2}/${CRATE:2:2}/${CRATE}"
          for _ in $(seq 1 60); do
            if curl -sf -A "flow-release-guard" "$path" | grep -q "\"vers\":\"${VERS}\""; then exit 0; fi
            sleep 5
          done
          echo "::error::${VERS} 五分钟内未出现在稀疏索引里；根包发布无法安全继续"
          exit 1

      - name: Publish server root to crates.io
        env:
          CRATE: weflow-server
          VERS: ${{ needs.guard.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # crates.io 对不合规的 User-Agent 一律 403（实测：默认 curl UA 与被显式清空的
          # UA 都吃 403，必须带一个自定义值）。漏掉它会把「已上架」误判成「没上架」，
          # 守卫随即失效、撞 already-uploaded——正是这道守卫要防的半程卡死。
          if curl -sf -A "flow-release-guard" "https://crates.io/api/v1/crates/${CRATE}/${VERS}" >/dev/null; then
            echo "::notice::${CRATE} ${VERS} 已发布过，跳过（幂等重跑）"
          elif [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::OIDC 未换到 crates.io token；检查 crates-io environment 与 trusted publisher 配置"
            exit 1
          else
            cargo publish --locked
          fi

  pypi:
    name: Publish to PyPI
    needs: [crates] # 保持 SDK/根包先发；PyPI 自己仍有 pypi environment 审批
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 人工闸门：PyPI 发布不可撤销；pypi environment 配 Required reviewers 后停在这里。
    environment: pypi
    permissions:
      contents: read
      id-token: write # pypa 动作的 OIDC 短期凭据
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python for PyPI build
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python SDK distributions
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      # 上传用 pypa 的官方动作（OIDC 换短期凭据，仓库里不留长期 token）。
      # 它是容器动作，只能在 Linux runner 上跑；dist 路径相对工作区根。
      - name: Publish Python SDK to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist/
          # 重跑作业不该因为「这版本已发过」而红。
          skip-existing: true
