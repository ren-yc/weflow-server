# Pull-request / push gate: clippy with warnings denied, then the test suite.
#
# Why both OSes rather than just Linux: the codebase has genuinely
# platform-conditional code (e.g. the media proxy's `CURL_BIN` is `curl.exe`
# under `#[cfg(windows)]` and `curl` otherwise). clippy only lints the branch
# that is actually compiled, so a Linux-only run leaves the Windows arm
# unchecked — and Windows is the platform this service is built for.
#
# Both jobs go through scripts/build.{ps1,sh}, the same wrappers release.yml
# uses: rusqlite bundles SQLCipher + vendored OpenSSL, whose perl Configure
# flow calls cl.exe/link.exe directly and needs the vcvars environment that
# the cc crate does not set up on its own.
#
# The toolchain is pinned in rust-toolchain.toml, which is what makes
# `-D warnings` safe to gate on: a floating toolchain would let a new stable
# release introduce a lint and turn every PR red without a code change.
#
# The matrix `os:` values are not free-form — they are GitHub's hosted-runner
# labels, and only labels GitHub publishes will schedule (a typo queues forever
# rather than failing fast). `-latest` is a moving alias GitHub repoints on its
# own schedule, so unlike the toolchain the runner image is deliberately NOT
# pinned here. If an image bump ever breaks the Windows job (MSVC / Strawberry
# Perl / nasm all come from the image, not from us), pin to a dated label such
# as `windows-2025` to decouple the fix from the image rollout.
#
# Note there is deliberately no `cargo fmt --check` step. This repository has
# never been rustfmt-clean; adding the check would require a repo-wide reformat
# first, which is a separate decision (and a separate commit) from this gate.
#
# Do NOT "simplify" this by hoisting `RUSTFLAGS: -Dwarnings` to the job level.
# It looks like it would save a compile — `-- -D warnings` gives the clippy step
# its own build fingerprint, so clippy and test do not share a cache and the
# vendored OpenSSL is built twice on a cold run. But `RUSTFLAGS` applies at link
# time too, and on Windows the MSVC link emits LNK4099 (missing OpenSSL PDBs)
# under the `linker_messages` warn-by-default lint. Denying warnings globally
# turns that into a hard error and the Windows test step can never pass.
# The double build is the cheaper problem, and rust-cache absorbs it after the
# first successful run caches both fingerprints.
name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run obsolete. Cancelling it
# matters more than usual here because the vendored OpenSSL build is expensive.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # release.yml budgets 90 for compiling vendored OpenSSL once; a cold run here
    # compiles it twice (see the fingerprint note above), so allow more headroom.
    timeout-minutes: 120
    strategy:
      fail-fast: false # a Windows-only or Linux-only failure is the interesting case
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # fetch-depth: 0 —— 提交信息扫描需要本次 push / PR 的提交范围，
      # 默认的浅克隆（depth=1）里没有 `before` 也没有 `HEAD~1`，那一步会无从比较。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ── 文档门（廉价，放在最前：失败要在昂贵的 vendored OpenSSL 编译之前暴露）──
      # 两项都只在 Linux 上跑：扫描器没有任何平台条件编译，Windows 开发机由本地
      # pre-commit / commit-msg 钩子覆盖；而 Linux 上 python3 必定存在，不必做解释器探测。
      - name: forbidden references (tracked files)
        if: runner.os != 'Windows'
        run: python3 scripts/forbidden_refs.py --tree

      # 直推 master 的路径不经过本地钩子，所以提交信息必须在这里再扫一遍。
      - name: forbidden references (commit messages)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
            range="FETCH_HEAD..HEAD"
          else
            before="${{ github.event.before }}"
            range="HEAD~1..HEAD"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$before^{commit}" 2>/dev/null; then
              range="$before..HEAD"
            fi
          fi
          status=0
          for sha in $(git log --format=%H "$range"); do
            git log -1 --format=%B "$sha" > /tmp/commit-msg.txt
            if ! python3 scripts/forbidden_refs.py --message-file /tmp/commit-msg.txt; then
              echo "  ↑ 上面的命中来自提交 $sha" >&2
              status=1
            fi
          done
          exit $status

      # 公共段不漂移：本仓 AGENTS.md 里公共段标记之间的内容，必须与契约仓库
      # **所 pin tag**（conformance.pin）上的 AGENTS-common.md 逐字一致。
      #
      # 比对的是所 pin tag 的内容，**不是本仓工作副本**——否则改本地副本就能让比对
      # 通过，守卫形同虚设；也因此「升 pin」是一个需要评审的动作，不是随手一行。
      # clone 走 HTTPS：公开仓库无需凭据，也不必在 CI 里配 secret。
      - name: common section matches the pinned contract tag
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pin="$(tr -d '[:space:]' < conformance.pin)"
          git clone --depth 1 --branch "$pin" https://github.com/ren-yc/flow-contract.git conformance
          python3 scripts/check_common_section.py --conformance conformance

      # ── 四条数据不变量（契约用例里最硬的那几条）──────────────────────────────
      #
      # 这一条**是开着的**，因为它现在就是绿的，而且它守的是四条已定的数据不变量：
      #
      #   `platformMessageId` 必为 string ／ `timestamp` 必为秒级 number ／
      #   `type` 永不为 6 ／ `content` 键必须存在（值可为 null）
      #
      # 它们此前**只在一整套一致性套件里跑**，而那一步因为下面那条待裁决的断言一直是关着的
      # —— 于是这四条钉子实际上没在 CI 里拦过任何东西。用 `--case` 只挑 nails 跑，就能让
      # 「现在就能绿的」先变成门禁，「还没裁决的」继续等。
      #
      # 与下面那一步共用同一个 pin：升 pin 时两处一起生效。
      - name: conformance nails (contract data invariants)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pin="$(tr -d '[:space:]' < conformance.pin)"
          git clone --depth 1 --branch "$pin" https://github.com/ren-yc/flow-contract.git conformance-nails
          FLOW_CONTRACT_DIR="$PWD/conformance-nails" FLOW_CONTRACT_CASE="nails" \
            bash scripts/build.sh test --locked --test conformance_runner -- --ignored

      # ── 嵌入者示例（承诺面的第二道验收器）────────────────────────────────
      #
      # `examples/` 是**独立 crate**，只能看见 `pub`。所以在**不开 `testing`** 的前提下编译它，
      # 同时证明三件事：
      #
      #   ① 承诺面**够用** —— 示例做的事，嵌入者照着做就行；
      #   ② 示例**没有借用实现面** —— 一旦它用了 `pub(crate)` 的东西，这里就编译失败；
      #   ③ 它**不拉 axum/tokio** —— `--no-default-features` 下能编译，说明「不起 HTTP 也能用」
      #      不是一句口号。
      #
      # 只编译不运行：CI 里没有真实微信账号。**运行**由 `tests/embed_contract.rs` 在每次 CI 里
      # 等价地证明（同一套 API，对着夹具造的库），真库那次由开发者在本地跑。
      - name: embed example builds without default features
        if: runner.os != 'Windows'
        run: bash scripts/build.sh build --locked --example embed --no-default-features

      # ── 类型化 SDK（clients/rust）──────────────────────────────────────────
      #
      # 生成的客户端类型入库；这一步断言「重生成后无 diff」——类型与描述静默分叉
      # （改了服务端却忘了重新生成）会在这里红，而不是等到下游生成的代码缺类型。
      # 生成本体是仓内工具（weflow-regen），它的规范化（3.1 → 3.0）是确定性的，
      # 所以 diff 只能来自描述本身的语义变化。
      - name: generated client matches its description
        if: runner.os != 'Windows'
        run: bash scripts/build.sh run --locked -p weflow-regen -- --check

      # SDK 的行为面（游标排空、重连、就绪轮询）对着夹具 mock 测，不需要真库。
      # 该 crate 无原生依赖（无 vendored OpenSSL），直接 cargo 跑即可。
      - name: typed SDK tests
        if: runner.os != 'Windows'
        run: cargo test --locked -p weflow-client

      # Python SDK：模型生成物入库，regen --check 断言 spec 与生成管线无漂移
      # （spec 取自 Rust 生成工具的 --dump-spec，绕开 golden 的占位掩码）；
      # 行为层对进程内 ASGI mock 测，独立 venv 装包，不碰全局解释器。
      # The Python no-diff gate regenerates the whole tree with the pinned
      # openapi-generator jar (openapitools.json) - unlike the old spec-only
      # check this needs node/npx AND a JRE, so both are pinned explicitly
      # rather than trusting the image default (the same reason the Rust
      # toolchain is pinned in rust-toolchain.toml: a moving default turns
      # CI red or silently green on days nobody changed code).
      - name: OpenAPI generator toolchain (node + jre)
        if: runner.os != 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java runtime for openapi-generator
        if: runner.os != 'Windows'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: generated python models match their description
        if: runner.os != 'Windows'
        run: (cd clients/python && python3 scripts/regen.py --check)

      - name: typed python SDK tests
        if: runner.os != 'Windows'
        run: |
          cd clients/python
          python3 -m venv .venv
          .venv/bin/python -m pip install -q -e '.[dev]'
          .venv/bin/python -m pytest tests/ -q

      # Handwritten SDK layer lint: explicit rule set from
      # clients/python/pyproject.toml (no default-set drift). Reuses the
      # SDK-test venv (created immediately above), ruff pinned in dev
      # extras - do not pip-install ruff here: an unpinned ruff rebinds
      # rule behavior to whatever version CI happens to fetch. Do not add
      # --config / --extend-exclude on the CLI: both change how the
      # config's relative excludes resolve (cwd vs config dir) and would
      # silently scan the generated tree.
      - name: ruff (clients/python handwritten layer)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd clients/python
          .venv/bin/python -m ruff check src tests

          # discriminating check of the EXCLUSION (the lint step passing
          # alone does not prove generated/ is skipped): an isolated scan
          # (no config, no exclude) over the same paths must find on the
          # order of a thousand hits in the generated tree. Fewer than 100
          # means the exclude is not what keeps the main check green -> fail.
          # Measured locally: weflow 2253 / qqflow 2149 hits.
          # || true: ruff exits 1 when it finds violations, and the job shell
          # runs with -e -o pipefail - without this the guard aborts on the
          # nonzero pipeline before reading the count it just captured.
          found=$(.venv/bin/python -m ruff check src tests \
                 --isolated --select E4,E7,E9,F,I,RUF,G,LOG,BLE,UP 2>&1 \
                 | sed -n "s/^Found \([0-9]*\) error.*/\1/p" | tail -1 || true)
          if [ -z "$found" ] || [ "$found" -lt 100 ]; then
            echo "ruff exclusion guard FAILED: isolated scan found ${found:-0} hits" \
                 "(expected ~2000 if generated/ is really scanned)" >&2
            exit 1
          fi
          echo "ruff exclusion guard ok: generated tree scan = $found hits"

      # ── 一致性套件（契约用例，两个仓库共用一份）────────────────────────────
      #
      # 此前关闭过一段时间：套件里有一条断言 404 响应体带 `error` 键，而本仓库统一成
      # `{success, code, message}`。那条分歧已裁决 —— **契约改断言对齐实现**（`v0.2.0`，minor，
      # 顺带把断言写严：三个键齐全 ＋ `success` 为 false ＋ `code` 回显状态码），所以这里打开了。
      #
      # 套件与平台无关，Linux 上跑一次就够，且那里 python3 必定存在。
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # --locked: fail rather than silently resolve a different dependency set
      # than Cargo.lock records, so CI tests what a checkout actually builds.
      - name: clippy (deny warnings)
        if: runner.os == 'Windows'
        run: powershell -File scripts/build.ps1 clippy --all-targets --locked -- -D warnings

      - name: clippy (deny warnings)
        if: runner.os != 'Windows'
        run: bash scripts/build.sh clippy --all-targets --locked -- -D warnings

      - name: test
        if: runner.os == 'Windows'
        run: powershell -File scripts/build.ps1 test --locked

      - name: test
        if: runner.os != 'Windows'
        run: bash scripts/build.sh test --locked
      - name: build wrapper passthrough (scripts/tests)
        if: runner.os == 'Windows'
        run: |
          python -m pip install -q pytest
          python -m pytest scripts/tests/ -q

      - name: build wrapper passthrough (scripts/tests)
        if: runner.os != 'Windows'
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest scripts/tests/ -q

      - name: conformance suite (flow-contract cases)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pin="$(tr -d '[:space:]' < conformance.pin)"
          git clone --depth 1 --branch "$pin" https://github.com/ren-yc/flow-contract.git conformance-suite
          FLOW_CONTRACT_DIR="$PWD/conformance-suite" \
            bash scripts/build.sh test --locked --test conformance_runner -- --ignored
