name: 功能建议
description: 提出新功能或对现有行为的改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请优先描述「要解决的问题与使用场景」，这比具体实现方案更能帮助评估。
        涉及**接口契约**（字段、游标语义、`/chatlab/*` 形状）的提议，请在正文里点明——那类改动要先进
        [flow-contract](https://github.com/ren-yc/flow-contract) 再回到本仓，不会只在本仓落地。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与要解决的问题
      description: 你在做什么、卡在哪一步、现在的绕法是什么。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 期望的行为或接口形态；如果只是「更快 / 更稳」，请给出可判定的判据。
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 涉及的面
      options:
        - 拉取面与消息游标
        - 其它 HTTP 端点
        - SSE 推送
        - ChatLab 适配面
        - CLI
        - MCP 工具面
        - 类型化 SDK
        - 构建、发布与工具链
        - 文档
        - 其它
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 其它可行的做法，或你目前使用的临时解决方式。
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 附加信息
      description: 截图或相关配置示例（记得脱敏，密钥用 `<your-key>` 占位）。
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索既有 issue，确认无重复
          required: true
        - label: 我已确认以上内容不含真实聊天记录、wxid、库密钥、token 或其它个人身份信息
          required: true
