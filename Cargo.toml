[package]
name = "weflow-server"
version = "0.9.0"
edition = "2024"
description = "Headless HTTP API + SSE service for reading local WeChat 4.x chat records (WCDB/SQLCipher-4 decryption, real-time monitoring)"
license = "MIT"
repository = "https://github.com/ren-yc/weflow-server"

[dependencies]
anyhow = "1"
aes = "0.8"
async-stream = { version = "0.3", optional = true }
axum = { optional = true, version = "0.8", features = ["macros"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chrono = "0.4"
dirs = "6"
futures-util = { version = "0.3", optional = true }
hex = "0.4"
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }
hmac = "0.12"
md-5 = "0.10"
notify = { version = "8.2", optional = true }
notify-debouncer-mini = { version = "0.7", optional = true }
parking_lot = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.8"
rusqlite = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { optional = true, version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util", "fs"] }
tokio-stream = { optional = true, version = "0.1", features = ["sync"] }
tokio-util = { optional = true, version = "0.7", features = ["io"] }
tower-http = { optional = true, version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OpenAPI 描述生成。**只加在服务层**：schema 是 HTTP 面的东西，解析/存储层不该依赖它。
utoipa = { optional = true, version = "6", features = ["axum_extras"] }
zstd = "0.13"
# 命令行子命令面的解析层。刻意 `default-features = false`：clap 的默认 feature 会带进
# colorhelp／suggestions 等终端装饰依赖，而本仓的 CLI 输出要能被脚本消费。
clap = { version = "4", optional = true, default-features = false, features = ["std", "env", "help", "usage", "error-context", "derive"] }
# CLI 与 MCP 都通过 HTTP 访问服务，因此**复用同工作区的 Rust SDK**，而不是在服务端 crate
# 里再手写一份 HTTP。两份实现的失败模式是漂移：字段名、错误语义、分页规则各改各的，
# 而 SDK 的公共面才是被测试钉住的那一份。
weflow-client = { path = "clients/rust", version = "0.9.0", optional = true }
# MCP 工具面。default-features = false 加自选 feature：rmcp 的默认 feature 会带进 HTTP
# 传输层与 reqwest/tower，而本面只在 stdio 上跑 server/macros。
rmcp = { version = "3.5", optional = true, default-features = false, features = ["server", "macros", "transport-io"] }
# 工具参数与输出的 JSON Schema。rmcp 用的是 schemars 1，而 derive 生成的代码按 crate 名
# 解析路径，所以它必须是本包的直接依赖（不能只靠 rmcp 传递进来）。
schemars = { version = "1", optional = true }

[features]
default = ["server", "cli", "mcp"]

# 命令行子命令面（serve／token／查询类／sync）。
#
# 为什么必须是可选 feature：`--no-default-features` 的嵌入契约要求依赖树里不含
# axum／tokio（docs/architecture.md 的「依赖面的实际约束」，CI 的 embed 例子钉子守着）。
# 本 feature 会带进 clap 与 SDK（进而 reqwest／tokio），所以关掉默认 feature 时它必须
# 一并消失 —— 而不是变成「库用户也得下载 clap」。
cli = ["dep:clap", "dep:weflow-client", "dep:tokio", "server"]

# MCP 工具面：在 stdio 上把只读查询暴露成工具。隐含 `cli` —— 入口是 mcp 子命令。
# 关掉默认 feature 时它必须一并消失（嵌入契约要求依赖树里没有 cli／rmcp）。
mcp = ["dep:rmcp", "dep:schemars", "cli"]

# 服务层：HTTP/SSE。依赖 axum 与 tokio 运行时。
server = ["dep:axum", "dep:utoipa", "dep:tower-http", "dep:tokio-stream", "dep:tokio-util", "dep:tokio", "sync", "media"]

# 同步引擎：watcher 与水位线增量。**隐含 `media`** —— 增量同步顺带导出媒体（`sync/mod.rs` 调
# `media::export`），拆开就编译不过。这也是为什么单独开 `sync` 时 `media` 会跟着来。
sync = ["dep:tokio", "dep:notify", "dep:notify-debouncer-mini", "dep:async-stream", "dep:futures-util", "dep:tokio-stream", "media"]

# 媒体导出（调用外部 ffmpeg）。
media = []

# 造库/造密钥工具。
#
# 两个用途，缺一不可：
#   ① **嵌入者写自己的测试**时需要造一份假库（和我们测试里做的是同一件事），这是有意设计的
#      工具面，不是给测试开的后门；
#   ② 本仓库的集成测试在**独立 crate** 里，只能看见 pub。默认构建下实现面是 pub(crate)
#      （边界由编译器强制），开了这个 feature 才转成 pub。
testing = []

[[bin]]
name = "weflow-server"
path = "src/main.rs"
# 二进制要建 tokio 运行时并起 HTTP 服务 —— 没有 `server` feature 时它没有意义，
# 与其编译出一个起不来的 bin，不如让 cargo 直接不构建它。
required-features = ["server"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = true

[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[workspace]
members = ["clients/rust", "clients/regen"]
resolver = "3"
