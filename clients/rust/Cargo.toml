[package]
name = "weflow-client"
version = "0.7.0"
edition = "2024"
description = "Typed Rust client for weflow-server's HTTP API (generated types + handwritten behavior layer)"
license = "MIT"
publish = false

[dependencies]
progenitor-client = "0.15.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
futures-util = "0.3"
log = "0.4"
bytes = "1"
async-stream = "0.3"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
