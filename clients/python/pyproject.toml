[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weflow-sdk"
version = "0.9.0"
description = "Typed Python client for weflow-server's HTTP API (generated models + handwritten behavior layer)"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "ren-yc" }]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dateutil>=2.8",
  "typing-extensions>=4.7",
]

[project.optional-dependencies]
# ruff is pinned exactly: the lint gate below selects rules explicitly,
# but rule *behavior* still drifts with the ruff version - an unpinned
# CI step could go red (or silently green) on a day nobody changed code.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "openapi-generator-cli>=7", "ruff==0.16.1"]

[project.urls]
Homepage = "https://github.com/ren-yc/weflow-server"
Repository = "https://github.com/ren-yc/weflow-server"
Issues = "https://github.com/ren-yc/weflow-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/weflow_sdk"]

# Explicit lint config: relying on ruff defaults would tie CI to whatever
# a version bump decides the default set is. The generated tree is
# excluded *here only* - CLI --extend-exclude resolves relative to the
# cwd (from repo root that spelling silently scans the whole generated
# tree), and passing --config shifts config-relative excludes to cwd too.
# Keeping the exclude in this file makes it config-dir-relative, which is
# the one form that works from both clients/python and the repo root.
[tool.ruff]
extend-exclude = ["src/weflow_sdk/generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF", "G", "LOG", "BLE", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
