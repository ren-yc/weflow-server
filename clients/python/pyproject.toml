[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weflow-sdk"
version = "0.7.0"
description = "Typed Python client for weflow-server's HTTP API (generated models + handwritten behavior layer)"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dateutil>=2.8",
  "typing-extensions>=4.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "openapi-generator-cli>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/weflow_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
